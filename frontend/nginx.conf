# Served as one origin: static assets from this container, /api and /health
# proxied to the backend service — mirrors vite.config.ts's dev proxy so the
# SameSite=Strict refresh cookie behaves identically to local dev.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell — a stale index.html can reference JS chunks
    # that no longer exist after the next deploy.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed build assets are safe to cache hard; Vite renames the file on
    # every content change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /api/ {
        proxy_pass http://backend:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8010/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: any other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
